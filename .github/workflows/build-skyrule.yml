name: Build Pikafish SkyRule Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Official Pikafish ref (master or commit SHA)'
        required: false
        default: 'master'
  push:
    paths:
      - 'apply_skyrule.py'
      - 'src_skyrule.h'
      - '.github/workflows/build-skyrule.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang
            python3

      - name: Fetch official Pikafish
        shell: msys2 {0}
        env:
          PIKAFISH_REF: ${{ github.event.inputs.ref || 'master' }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/official-pikafish/Pikafish.git pikafish
          cd pikafish
          git fetch --depth=1 origin "${PIKAFISH_REF}"
          git checkout FETCH_HEAD
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply overlay
        shell: msys2 {0}
        run: |
          cp apply_skyrule.py pikafish/
          cd pikafish
          python apply_skyrule.py

      - name: Build Windows x86-64 universal
        shell: msys2 {0}
        working-directory: pikafish/src
        run: |
          make -j"$(nproc)" build ARCH=x86-64
          test -f pikafish.exe
          ./pikafish.exe <<'EOF'
          uci
          quit
          EOF

      - name: Archive binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item pikafish/src/pikafish.exe "dist/Pikafish-Windows-x86-64-universal.exe"
          "$env:UPSTREAM_SHA" | Out-File -Encoding utf8 dist/upstream-sha.txt
          Compress-Archive -Path "dist/Pikafish-Windows-x86-64-universal.exe", "dist/upstream-sha.txt" -DestinationPath "dist/Pikafish-Windows-x86-64-universal.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pikafish-Windows-x86-64-universal
          path: |
            dist/Pikafish-Windows-x86-64-universal.zip
            dist/upstream-sha.txt
